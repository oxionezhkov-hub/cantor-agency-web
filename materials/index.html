<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Материалы встречи — Cantor Agency</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="icon" type="image/svg+xml" href="/images/brand/favicon.svg">
<style>
:root{--red:#E8391D;--ink:#1F1D36;--muted:#54526B;--bg:#FBF7F0;--line:#F0E9DE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geologica',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:56px 16px 72px}
h1{font-family:'Unbounded','Arial Black',sans-serif;font-weight:700;font-size:clamp(28px,6vw,44px);line-height:1.15;letter-spacing:-0.02em}
.lead{margin-top:12px;font-size:18px;color:var(--muted)}
.list{margin-top:36px;display:flex;flex-direction:column;gap:16px}
.card{display:flex;align-items:center;gap:20px;padding:24px;background:#fff;border:2px solid var(--line);border-radius:24px;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--red);transform:translateY(-1px)}
.dot{flex:none;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-weight:700;font-size:15px}
.dot--avito{background:#DDF5E6;color:#17824A}
.dot--meta{background:#E1ECFF;color:#2A63D4}
.card b{display:block;font-size:19px}
.card span{display:block;margin-top:2px;font-size:15px;color:var(--muted)}
.card i{margin-left:auto;font-style:normal;font-weight:600;color:var(--red);white-space:nowrap}
</style>
</head>
<body>
<main class="wrap">
  <h1>Материалы встречи</h1>
  <p class="lead">Презентации спикеров, октябрь 2026</p>
  <div class="list">
    <a class="card" href="/materials/avito.pdf" target="_blank" rel="noopener">
      <div class="dot dot--avito">Ав</div>
      <div><b>Что сейчас работает на Авито</b><span>Олег Ежков, Cantor Agency</span></div>
      <i>PDF →</i>
    </a>
    <a class="card" href="/materials/meta.pdf" target="_blank" rel="noopener">
      <div class="dot dot--meta">M</div>
      <div><b>Что сейчас работает в рекламе Meta для репетиторов</b><span>Алексей Демьянович, TRT Marketing Agency</span></div>
      <i>PDF →</i>
    </a>
  </div>
</main>
</body>
</html>
