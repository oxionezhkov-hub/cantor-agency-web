name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check landing build and cache regression
        run: |
          node scripts/build-promo-platform.cjs --check
          node --test tests/promo-platform.test.cjs

      - name: Deploy via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --delete-excluded --exclude='.git*' --exclude='.github' --exclude='_worker.js' --exclude='wrangler.jsonc' --exclude='.assetsignore' --exclude='.wrangler'
          path: ./
          remote_path: ${{ secrets.SSH_DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Verify published landing
        run: node scripts/check-promo-platform-live.cjs
